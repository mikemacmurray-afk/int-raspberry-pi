<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garden Irrigation • Cranleigh OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090e1a;
      --card-bg: rgba(18, 26, 46, 0.82);
      --card-hover: rgba(28, 40, 70, 0.95);
      --border: rgba(255, 255, 255, 0.09);
      --border-glow: rgba(56, 189, 248, 0.35);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-y: auto !important;
      touch-action: pan-y !important;
      -webkit-overflow-scrolling: touch !important;
      padding: 1.25rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      backdrop-filter: blur(16px);
      transition: all 0.2s;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.18);
      background: var(--card-hover);
    }

    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* Touch Friendly Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">🌿</div>
      <div>
        <h2 style="font-size: 1.3rem; font-weight: 800;">Garden Irrigation</h2>
        <div style="font-size: 0.78rem; color: var(--text-muted);">Outdoor Module • Cranleigh OS</div>
      </div>
    </div>
    <div style="display: flex; gap: 0.5rem;">
      <button class="btn" onclick="fetchTelemetry()">🔄 Refresh</button>
    </div>
  </header>

  <main class="grid">
    <div class="card">
      <h3 style="font-size: 1rem; margin-bottom: 0.5rem;">Status & Telemetry</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">
        Connected to core home conductor service.
      </p>
      <div id="telemetry-info" style="font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #38bdf8;">
        Loading live metrics...
      </div>
    </div>

    <div class="card">
      <h3 style="font-size: 1rem; margin-bottom: 0.5rem;">Controls & Automation</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">
        Add your application-specific triggers or relay switches here.
      </p>
      <button class="btn" onclick="alert('Garden Irrigation action triggered!')">Trigger Action</button>
    </div>
  </main>

  <script>
    async function fetchTelemetry() {
      try {
        const res = await fetch('/api/state');
        if (!res.ok) return;
        const state = await res.json();
        document.getElementById('telemetry-info').innerText = 
          `Solar: ${state.sunsynk?.pv_watts ?? 0} W | Batt: ${state.sunsynk?.battery_soc ?? 0}%`;
      } catch (err) {
        document.getElementById('telemetry-info').innerText = 'Telemetry standby';
      }
    }

    window.onload = fetchTelemetry;
  </script>
</body>
</html>
